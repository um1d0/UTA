<div class="cart-container">
  <h2>Your Cart</h2>


    <div class="cart-items">
      @for (item of cartItems; track $index) {
        <div class="cart-item">
          <img [src]="getItemImage(item)" [alt]="getItemName(item)" />

          <div class="item-info">
            <h3>{{ getItemName(item) }}</h3>
            <p class="item-price">{{ getItemPrice(item) | currency }}</p>
          </div>

          <div class="item-actions">
            <button class="qty-btn" type="button" (click)="decrease(item)">-</button>
            <span class="quantity">{{ getItemQuantity(item) }}</span>
            <button class="qty-btn" type="button" (click)="increase(item)">+</button>
          </div>

          <button class="remove-btn" type="button" (click)="remove(getItemId(item))">Remove</button>
        </div>
      }
    </div>

    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <strong>{{ total | currency }}</strong>
      </div>

      <button class="btn-primary" type="button">Proceed to Checkout</button>
    </div>
  
</div>
